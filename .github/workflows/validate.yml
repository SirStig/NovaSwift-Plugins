name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches download links that have died

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Schema, duplicate ids, dependencies
        run: python3 scripts/validate.py
      - name: Download links are real files
        run: python3 scripts/validate.py --urls
      - name: Checksums (only entries that list one)
        run: python3 scripts/validate.py --urls --hash
